[package]
name = "bevy_framepace"
version = "0.23.0"
edition = "2024"
description = "Frame pacing and frame limiting for Bevy"
documentation = "https://docs.rs/bevy_framepace"
repository = "https://github.com/aevyrie/bevy_framepace"
license = "MIT OR Apache-2.0"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Winit will explode in docs.rs otherwise
[package.metadata.docs.rs]
features = ["bevy_winit/x11"]

[[example]]
name = "demo"
path = "examples/demo.rs"
required-features = ["default"]

[[example]]
name = "minimal"
path = "examples/minimal.rs"
required-features = ["default"]

[dependencies]
bevy_app = { version = "0.20", default-features = false }
bevy_diagnostic = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false }
bevy_log = { version = "0.20", default-features = false }
bevy_platform = { version = "0.20", default-features = false }
bevy_reflect = { version = "0.20", default-features = false }
bevy_render = { version = "0.20", default-features = false }
bevy_time = { version = "0.20", default-features = false }
bevy_window = { version = "0.20", default-features = false }
bevy_winit = { version = "0.20", default-features = false }
# Non-bevy
spin_sleep = "1.0"

[dev-dependencies]
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "default_font",
    "bevy_color",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "x11",
  ]
}

[features]
default = ["framepace_debug"]
framepace_debug = []
